upstream django {
    server django:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    client_max_body_size 50M;
    keepalive_timeout 65;

    # ── API y WebSocket ──────────────────────────────────────────────────────
    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;

        # WebSocket headers (required for Daphne/Channels)
        # $connection_upgrade se define en 00-upgrade-map.conf:
        #   WebSocket (Upgrade: websocket) -> Connection: upgrade
        #   HTTP normal                    -> Connection: close
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;  # 24h for long-lived WebSocket connections
    }

    # ── Archivos estáticos ───────────────────────────────────────────────────
    location /static/ {
        alias /code/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        gzip_static on;
    }

    # ── Favicon desde estáticos ────────────────────────────────────────────────
    # [CORREGIDO 2026-09-15] Apuntaba a /code/staticfiles/favicon.ico -- archivo
    # que nunca existio (404 real, confirmado en consola del navegador). El build
    # de Vite (Dockerfile: COPY --from=frontend-builder /app/dist /code/static/
    # panel/js/bundle) deja favicon.svg bajo esa ruta, nunca un .ico en la raiz.
    # Mismo alias que ya tenia PROD (nginx-common.conf, "Fase 22 post-roadmap") --
    # dev nunca se actualizo cuando se corrigio alli, quedando desincronizado.
    location = /favicon.ico {
        alias /code/staticfiles/panel/js/bundle/favicon.svg;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Web App Manifest (PWA) ─────────────────────────────────────────────────
    # [AGREGADO 2026-09-15] No existia ninguna regla para /manifest.json -- caia
    # al catch-all de Django (location /), que devolvia spa_shell.html completo
    # en vez del manifest real, causando un error de sintaxis JSON real en el
    # navegador. Mismo alias que ya tenia PROD para este mismo problema.
    location = /manifest.json {
        alias /code/staticfiles/panel/js/bundle/manifest.json;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Archivos de media (uploads) ──────────────────────────────────────────
    location /media/ {
        alias /code/media/;
        expires 7d;
        add_header Cache-Control "public";
    }
}
