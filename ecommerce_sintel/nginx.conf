upstream django {
    server django:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    client_max_body_size 50M;
    keepalive_timeout 65;

    # ── API y WebSocket ──────────────────────────────────────────────────────
    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;

        # WebSocket headers (required for Daphne/Channels)
        # $connection_upgrade se define en 00-upgrade-map.conf:
        #   WebSocket (Upgrade: websocket) -> Connection: upgrade
        #   HTTP normal                    -> Connection: close
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;  # 24h for long-lived WebSocket connections
    }

    # ── Archivos estáticos ───────────────────────────────────────────────────
    location /static/ {
        alias /code/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        gzip_static on;
    }

    # ── Favicon desde estáticos ────────────────────────────────────────────────
    location = /favicon.ico {
        alias /code/staticfiles/favicon.ico;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Archivos de media (uploads) ──────────────────────────────────────────
    location /media/ {
        alias /code/media/;
        expires 7d;
        add_header Cache-Control "public";
    }
}
