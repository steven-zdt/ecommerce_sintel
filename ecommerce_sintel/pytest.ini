[pytest]
DJANGO_SETTINGS_MODULE = ecommerce.settings.development
python_files = tests.py test_*.py *_tests.py
; --cov-fail-under: umbral inicial modesto (Quality Gate, auditoria enterprise
; 2026-07-24). Sube este numero a medida que crece la cobertura real, nunca lo
; bajes para que un PR pase. La config de que archivos excluir del calculo de
; cobertura vive en pyproject.toml [tool.coverage.run] (coverage.py la lee de
; ahi independientemente de pytest).
addopts = --import-mode=importlib --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=25

