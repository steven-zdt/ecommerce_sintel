# Resuelve el header Connection correcto segun el tipo de request.
# Cargado ANTES que default.conf por el prefijo 00- (orden alfabetico).
#
# WebSocket (Upgrade: websocket) -> Connection: upgrade
# HTTP normal (sin Upgrade)      -> Connection: close
map $http_upgrade $connection_upgrade {
    default   upgrade;
    ''        close;
}

# HARDENING F9: correlacion extremo a extremo. Si el cliente manda X-Request-ID se respeta (Django/ADK lo validan y lo
# regeneran si no tiene forma segura); si no, nginx usa su $request_id (32 hex). Django lo devuelve en la respuesta.
map $http_x_request_id $sintel_request_id {
    default   $http_x_request_id;
    ''        $request_id;
}
