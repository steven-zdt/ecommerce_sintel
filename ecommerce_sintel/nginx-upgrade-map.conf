# Resuelve el header Connection correcto segun el tipo de request.
# Cargado ANTES que default.conf por el prefijo 00- (orden alfabetico).
#
# WebSocket (Upgrade: websocket) -> Connection: upgrade
# HTTP normal (sin Upgrade)      -> Connection: close
map $http_upgrade $connection_upgrade {
    default   upgrade;
    ''        close;
}
