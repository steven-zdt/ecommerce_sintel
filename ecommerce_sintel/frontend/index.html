<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sintel | E-Commerce Ecosystem</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- External Styles (Bootstrap & Icons) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; }
    #shop-spa-root { min-height: 100vh; }
  </style>
</head>
<body>

  <!-- Contenedor Base para nuestra SPA Universal -->
  <div id="shop-spa-root">
    <!-- Spinner de carga inicial -->
    <div class="d-flex justify-content-center align-items-center vh-100 bg-white">
        <div class="text-center">
            <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
            <div class="fw-bold text-dark h5">Sintel</div>
            <div class="text-muted small">Cargando ecosistema inteligente...</div>
        </div>
    </div>
  </div>

  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Vite Entry Point -->
  <script type="module" src="/src/apps/admin/main.js"></script>
</body>
</html>
