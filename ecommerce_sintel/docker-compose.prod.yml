# =============================================================================
# DOCKER COMPOSE -- E-Commerce Sintel REST -- PRODUCCION
# =============================================================================
#
# Publicacion via Cloudflare Tunnel unicamente. Ningun servicio publica
# puertos al host: cloudflared entra por la red interna a nginx, y nginx
# proxea a django. Ver docs/deployment/ROADMAP_CLOUDFLARE_TUNNEL.md.
#
# Servicios (9, segun Fase 2 del roadmap + auditoria de puesta en produccion del
# AI Engine, 2026-08-17 + migracion ADK-11, 2026-09-14): nginx, django, db,
# redis, celery_worker, celery_beat, cloudflared, sintel_ai (OLD, LangGraph),
# sintel_ai_adk (NEW, Google ADK -- ver AUDITORIA/ADK_CUTOVER_PLAN.md).
#
# Ni sintel_ai ni sintel_ai_adk se publican al host (sin "ports", ver esos
# servicios abajo) -- solo Django les habla, dentro de sintel-network.
# AI_SUPPORT_CHAT_ENABLED sigue en false hasta activacion explicita posterior
# (fuera de alcance de este cambio de infraestructura).
#
# sintel_ollama: integrado el 2026-09-24 (aditivo, sin consumidores re-apuntados,
# ver el servicio mas abajo). Antes permanecia solo en dev por decision de proveedor LLM diferida. ChromaDB se retiro
# por completo del proyecto (FASE 4b, 2026-09-14), no aplica a ningun
# entorno. frontend
# (vite dev server) tampoco aplica: el bundle de Vue ya viene compilado dentro
# de la imagen runtime (ver Dockerfile, stage frontend-builder).
#
# Requiere (se completan en fases posteriores del roadmap):
#   - .env.production            (Fase 16)
#   - cloudflared/config.yml     (Fase 4)
#   - cloudflared/<tunnel>.json  (credenciales del tunel, Fase 4)
#   - certs/origin.pem + origin.key (Cloudflare Origin Certificate, Fase 8)
#   - nginx.prod.conf            (Fase 9)
#
# ⚠️  IMPORTANTE: siempre usar --env-file .env.production al invocar este
#     compose. El servicio "db" usa sustitucion ${DB_NAME}/${DB_USER}/
#     ${DB_PASSWORD} en su bloque "environment", y Docker Compose SOLO
#     resuelve ese estilo de variable desde un archivo literalmente llamado
#     ".env" o desde --env-file -- "env_file:" (usado en django/celery/etc.)
#     NO alimenta esta sustitucion, son mecanismos distintos. Sin el flag,
#     Postgres arranca con credenciales vacias. Ejemplo:
#       docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# =============================================================================

# Rotacion de logs (Fase 17): driver nativo de Docker, funciona igual en
# cualquier SO -- no depende de logrotate (poco practico en un host Windows).
# 10MB x 5 archivos = 50MB max por servicio, log mas viejo se descarta solo.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

name: sintel_production

services:

  # ─── INFRAESTRUCTURA (sin puertos publicados al host) ─────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: sintel_prod_redis
    restart: unless-stopped
    logging: *default-logging
    # [AGREGADO 2026-08-04, hallazgo M1 de AUDITORIA_INTEGRAL_PRODUCCION_2026-08-04.md]:
    # antes sin autenticacion -- cualquier proceso con acceso a sintel-network (ej. un
    # contenedor comprometido) podia leer/escribir tareas Celery, inyectar mensajes en
    # el WebSocket de soporte, o vaciar la cache sin credenciales. REDIS_PASSWORD viene
    # de .env.production, sustituido por Docker Compose (--env-file), no por env_file:.
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - sintel_prod_redis_data:/data
    healthcheck:
      # Con requirepass activo, el ping sin credenciales devuelve NOAUTH -- el
      # healthcheck debe autenticarse tambien o queda "unhealthy" para siempre,
      # bloqueando el arranque de django/celery_worker/celery_beat (depends_on:
      # condition: service_healthy).
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sintel-network

  db:
    # FASE 1 (mision de simplificacion arquitectonica, 2026-09-14): mismo cambio que
    # docker-compose.yml (dev) -- pgvector/pgvector:pg16 es postgres:16 (Debian) con la
    # extension pgvector ya compilada, drop-in sobre el volumen de datos existente. NO
    # aplicar a produccion manualmente -- va por el flujo normal de deploy.sh.
    image: pgvector/pgvector:pg16
    container_name: sintel_prod_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sintel_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sintel-network

  # ─── APLICACIÓN ────────────────────────────────────────────────────────────
  django:
    build:
      context: ..
      dockerfile: ecommerce_sintel/Dockerfile
      target: runtime
    # Tag propio de produccion (2026-08-08, hallazgo de auditoria) -- antes
    # este tag ("ecommerce_sintel:runtime") era IDENTICO al que usa
    # docker-compose.yml (dev), y Docker no separa nombres de imagen por
    # proyecto/compose: cualquier build de dev sobreescribia el tag que
    # produccion resolveria en su proximo restart, sin que produccion se
    # enterara. El contenedor ya corriendo queda anclado a su propia imagen
    # (no le afecta retroactivamente), pero el proximo restart/recreate SI
    # heredaria lo ultimo que dev haya construido. Nunca volver a compartir
    # este tag con docker-compose.yml.
    image: ecommerce_sintel:prod-runtime
    container_name: sintel_prod_django
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    # Sin bind mount de codigo fuente: el codigo vive horneado en la imagen
    # (COPY ecommerce_sintel/ /code/ en el Dockerfile). Solo se montan
    # volumenes de datos persistentes (estaticos, media y documentos KYC).
    volumes:
      - sintel_prod_static_volume:/code/staticfiles
      - sintel_prod_media_volume:/code/media
      - sintel_prod_kyc_volume:/code/private_media/kyc
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Host header explicito: ALLOWED_HOSTS en produccion (Fase 16) solo
      # tiene los 4 dominios reales, sin "localhost" -- sin este header
      # Django rechaza el propio healthcheck con DisallowedHost (bug real
      # encontrado en el primer despliegue, Fase 22). Se prefiere esto sobre
      # agregar "localhost" a ALLOWED_HOSTS, que hubiera debilitado esa lista
      # sin necesidad real.
      test: ["CMD", "curl", "-f", "-H", "Host: api.sintel.net.co", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # DNS publicos explicitos (no el resolver por defecto del host/Docker):
    # encontrado 2026-07-31 que el resolver del host puede quedar con una
    # cache negativa de un dominio recien dado de alta (ej. correo.sintel.net.co)
    # que Django necesita resolver para enviar email por SMTP -- esto evita
    # que ese tipo de cache stale del host bloquee resoluciones DNS reales
    # de los contenedores de produccion.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - sintel-network

  # ─── WORKERS ASINCRONOS ────────────────────────────────────────────────────
  celery_worker:
    # Build propio (2026-09-23, regla "cada contenedor construye/posee su propia
    # imagen, ninguna imagen vive fuera del contenedor al que sirve"): antes
    # reusaba `ecommerce_sintel:prod-runtime` (la imagen de `django`, sin build:
    # propio aqui). Mismo Dockerfile/contexto/target que django -- el codigo que
    # corre es identico a proposito (celery worker ejecuta el mismo codebase
    # Django) -- pero con tag e imagen propios, autocontenido. Mismo criterio de
    # tag EXCLUSIVO de produccion que ya aplica django (ver su comentario arriba,
    # 2026-08-08): nunca compartir este tag con docker-compose.yml.
    build:
      context: ..
      dockerfile: ecommerce_sintel/Dockerfile
      target: runtime
    image: ecommerce_sintel_celery_worker:prod-runtime
    container_name: sintel_prod_celery_worker
    restart: unless-stopped
    logging: *default-logging
    command: celery -A ecommerce worker --loglevel=info --concurrency=4 -Q default,marketing,notifications
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A ecommerce inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - sintel_prod_media_volume:/code/media
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - sintel-network

  celery_beat:
    # Build propio -- mismo motivo y mismo criterio de tag exclusivo de
    # produccion que celery_worker arriba.
    build:
      context: ..
      dockerfile: ecommerce_sintel/Dockerfile
      target: runtime
    image: ecommerce_sintel_celery_beat:prod-runtime
    container_name: sintel_prod_celery_beat
    restart: unless-stopped
    logging: *default-logging
    command: celery -A ecommerce beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_healthy
    volumes:
      - sintel_prod_beat_schedule:/tmp/celery_beat
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      # Repaso de backlog (AUDITORIA/18_AUDITORIA_PRODUCCION_RESILIENCIA_WS.md B4, 2026-08-03):
      # a diferencia de celery_worker, celery_beat nunca tuvo HEALTHCHECK -- nada distinguia "no
      # habia nada que notificar" de "el scheduler murio". `celery beat` no responde a `inspect
      # ping` (eso es solo para workers). La imagen de runtime (Python slim) no trae `pgrep` ni
      # `ps` -- verificado en vivo, ambos ausentes -- asi que se lee /proc directo con
      # grep/cat (si presentes en toda imagen POSIX minima). Check parcial (no confirma que siga
      # encolando tareas), pero es una mejora real sobre CERO monitoreo -- y ahora hay 2
      # PeriodicTask reales dependiendo de este proceso (notify-unattended-escalated-tickets de
      # Fase 1, notify-stale-operation-tickets de Fase 14).
      test: ["CMD-SHELL", "grep -a -l celery /proc/[0-9]*/cmdline >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - sintel-network

  # ─── OLLAMA (LLM local, privado -- NUNCA expuesto a Internet ni al host) ────
  # Integrado a produccion el 2026-09-24 a pedido explicito del usuario. Revierte la decision de
  # 2026-08-17 ("LM Studio como unico proveedor productivo, SIN Ollama") SOLO en lo de tener el
  # contenedor disponible: este cambio es ADITIVO y NO re-apunta a ningun consumidor -- sintel_ai /
  # sintel_ai_adk siguen usando LOCAL_MODEL_CHAIN (LM Studio) hasta que se cambie explicitamente
  # (o se configure desde /panel/soporte/ia-config, app ai_provider, con base_url
  # http://sintel_ollama:11434).
  # Sin "ports": solo alcanzable dentro de sintel-network (a diferencia de dev, que publica
  # 127.0.0.1:11434 para debug manual). Imagen fijada (no :latest) a la version verificada en dev
  # para que un pull futuro no cambie el comportamiento en produccion sin decision explicita.
  # GPU: el host tiene UNA sola GPU (RTX 4060) compartida con el Ollama de dev y con LM Studio --
  # los modelos se descargan a mano tras el primer arranque (ver docs), no se bajan solos.
  sintel_ollama:
    image: ollama/ollama:0.30.10
    container_name: sintel_prod_ollama
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - sintel_prod_ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - sintel-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ─── AI ENGINE (privado -- NUNCA expuesto a Internet) ──────────────────────
  # Auditoria de puesta en produccion (2026-08-17): agregado deliberadamente SIN
  # sintel_ollama (ver docs/deployment o el informe de esa auditoria) --
  # decision de proveedor LLM diferida a proposito. FASE 4b (mision de
  # simplificacion arquitectonica, 2026-09-14): ChromaDB retirado por completo
  # -- el RAG del chat vive en PostgreSQL+pgvector via el endpoint interno de
  # Django `ai_knowledge` (retrievers.py::retrieve_knowledge_for_chat), no en
  # este proceso. El motor arranca igual sin Ollama (get_llm()/ChatOllama no hacen red
  # al construirse, solo al primer uso real -- y AI_SUPPORT_CHAT_ENABLED queda
  # en false, asi que /chat no se invoca todavia). Si mas adelante se decide
  # Ollama local, agregar aqui un servicio "sintel_ollama" identico al de
  # docker-compose.yml (con su propia reserva de GPU) y listo -- si se decide un
  # proveedor externo (OpenAI/Anthropic), configurarlo desde
  # /panel/soporte/ia-config (app ai_provider, ya construida) sin tocar este
  # archivo. Este servicio se agrega ahora para poder validarlo (`docker compose
  # config`) y tenerlo listo -- activarlo con trafico real de Customers es un
  # paso posterior explicito (AI_SUPPORT_CHAT_ENABLED sigue en false).
  sintel_ai:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    image: ecommerce_sintel_ai:prod
    container_name: sintel_prod_ai
    restart: unless-stopped
    logging: *default-logging
    # Sin --reload (a diferencia del Dockerfile, pensado para dev): en
    # produccion el codigo va horneado en la imagen, igual que django --reload
    # solo agrega el proceso supervisor de watchfiles sin ningun beneficio real.
    command: uvicorn main:app --host 0.0.0.0 --port 8100
    # Sin "ports": AI Engine NO se publica al host bajo ninguna circunstancia
    # (Fase 7 de la auditoria) -- solo alcanzable dentro de sintel-network, y
    # unicamente Django (support/services/ai_bridge.py) le habla, nunca el
    # Customer directo.
    volumes:
      # FASE 5 (mision de simplificacion arquitectonica, 2026-09-14): el
      # bind-mount de solo lectura del repo (`.:/workspace:ro`) se retiro --
      # sin consumidor desde que se elimino el pipeline de generacion de
      # codigo (FASE 4a) y sus lectores de CODEBASE_PATH (FASE 5).
      # FASE 10: refresh token OAuth del MCP de Meta Ads (mcp_client/storage.py).
      # Se autoriza una vez con `python -m mcp_client.authorize`; despues el
      # cliente refresca solo. MCP_META_ADS_ENABLED debe ponerse en .env.production.
      - sintel_prod_mcp_tokens:/data/mcp
    env_file: .env.production
    environment:
      MCP_TOKEN_STORE_DIR: "/data/mcp"
      # CERRADO 2026-08-17 (auditoria "LM Studio como unico proveedor
      # productivo"): decision tomada -- LM Studio Server (Windows HOST,
      # 127.0.0.1:1234, API OpenAI-compatible), SIN Ollama como dependencia
      # productiva ni cadena hibrida. dev y produccion corren en el MISMO host
      # Windows (confirmado -- ambos stacks de contenedores viven en el mismo
      # Docker Desktop), asi que host.docker.internal:1234 aplica igual aca.
      # Ningun secreto: LM Studio local no exige API key real. Model ID real
      # confirmado via GET /v1/models, no inventado -- ver
      # ai_engine/.AGENT/LM_STUDIO_MIGRATION_2026-08-17.md para el detalle
      # completo (conectividad, hallazgos, concurrencia medida).
      LOCAL_MODEL_CHAIN: "lmstudio|openai-compatible|http://host.docker.internal:1234/v1|qwen/qwen3.5-9b"
      DJANGO_INTERNAL_API_URL: "http://django:8000/api/v1"
      # Bug real encontrado 2026-09-14 (migracion ADK-11, ver
      # AUDITORIA/ADK_CUTOVER_PLAN.md): ALLOWED_HOSTS de produccion es
      # estricto (solo los 4 dominios reales) -- una llamada interna con
      # Host: django:8000 (el nombre de servicio Docker) la rechaza Django
      # con DisallowedHost. Nunca se habia detectado porque
      # AI_SUPPORT_CHAT_ENABLED=false desde siempre: ninguna Tool ni
      # resolucion de identidad se habia ejecutado en produccion hasta hoy.
      # Mismo valor que ya usa el healthcheck de sintel_prod_django abajo.
      DJANGO_INTERNAL_HOST_HEADER: "api.sintel.net.co"
      # Checkpointer del Action Graph (DB 2 de Redis, separada de Channels/Cache
      # de Django) -- a diferencia de dev, Redis de produccion exige auth
      # (requirepass, ver servicio "redis" arriba); sin la password aqui, el
      # checkpointer fallaria con NOAUTH en cada turno de conversacion.
      CHECKPOINTER_REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/2"
      # AI_TOOLS_DEBUG deliberadamente NO definida (default False en config.py)
      # -- ese endpoint de debug nunca debe existir en produccion.
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # FASE 5 (2026-09-14): el arranque ya no escanea el codebase (retirado el
      # pipeline que lo necesitaba) -- start_period reducido de 150s a 30s,
      # midiendo ~15s de arranque real en dev tras el cambio. Sigue con margen
      # sobre lo medido, no al limite.
      start_period: 30s
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Hallazgo real (2026-09-14, migracion ADK-11): host.docker.internal NO
    # resuelve por defecto en la red "sintel-network" (confirmado en vivo:
    # "Name or service not known" -- a diferencia de la red de
    # docker-compose.yml/dev, donde si resuelve solo). extra_hosts con
    # "host-gateway" es el mecanismo documentado y confiable de Docker
    # Compose para garantizar esta resolucion sin depender del
    # comportamiento automatico (variable entre versiones/backend de
    # Docker Desktop). Sin esto, LOCAL_MODEL_CHAIN (LM Studio) es
    # inalcanzable -- confirmado que esto afectaba tambien al sintel_ai
    # viejo, nunca detectado por AI_SUPPORT_CHAT_ENABLED=false.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sintel-network

  # ADK-11 (Cutover, ver AUDITORIA/ADK_CUTOVER_PLAN.md seccion 4quinquies):
  # servicio NUEVO, orquestacion via Google ADK -- desplegado JUNTO a
  # sintel_ai (arriba), mismo patron ya usado y verificado en staging
  # (docker-compose.yml). Reusa el MISMO codigo fuente (ai_engine_adk/), sin
  # duplicar nada -- solo el bloque de servicio es nuevo. Igual que sintel_ai:
  # SIN "ports" (nunca expuesto a Internet), env_file .env.production,
  # tag propio de produccion. Incluye el fix del leak de razonamiento de
  # Qwen3.5 (AUDITORIA/REASONING_LEAK_FIX_REPORT.md), ya verificado con
  # trafico real en staging antes de llegar aqui. Activarlo con trafico real
  # de Customers exige DOS pasos separados y explicitos (ninguno hecho por
  # este bloque en si): (1) apuntar AI_ENGINE_URL aqui, (2) activar
  # AI_SUPPORT_CHAT_ENABLED -- este ultimo sigue en false, decision ya
  # tomada por el usuario 2026-09-14, no se toca en esta migracion.
  sintel_ai_adk:
    build:
      context: .
      dockerfile: ai_engine_adk/Dockerfile
    image: ecommerce_sintel_ai_adk:prod
    container_name: sintel_prod_ai_adk
    restart: unless-stopped
    logging: *default-logging
    # Sin "ports": mismo criterio que sintel_ai -- nunca expuesto al host.
    env_file: .env.production
    environment:
      # CAMBIADO 2026-09-24 (a pedido del usuario, plan PLAN_HARDENING_LLM_AGENTS_PRODUCCION_SINTEL_
      # QWEN_OLLAMA_PRIMARY_20260924.md, decision fija "PRIMARY=Ollama/Qwen3.5-9B, FALLBACK=LM Studio"):
      # el chat de soporte dejo de responder porque LM Studio (aplicacion de escritorio en el host
      # Windows) no estaba corriendo y era el UNICO proveedor. Ahora el primario es el Ollama de
      # produccion (sintel_ollama, contenedor propio con reinicio automatico) y LM Studio queda como
      # segunda entrada. Formato real de model_chain.py: "nombre|kind|base_url|modelo" separado por ";".
      # LIMITACION REAL (sintel_root_workflow.py): el ADK hoy solo usa la entrada PRIMARIA, sin
      # fallback automatico multi-entry (pendiente, FASE 3 del plan) -- la 2da entrada documenta el
      # orden objetivo pero todavia no se activa sola. Solo sintel_ai_adk: sintel_ai (OLD) no corre
      # motor de chat y conserva su cadena de LM Studio sin efecto.
      LOCAL_MODEL_CHAIN: "ollama|ollama-nativo|http://sintel_ollama:11434|qwen3.5:9b;lmstudio|openai-compatible|http://host.docker.internal:1234/v1|qwen/qwen3.5-9b"
      DJANGO_INTERNAL_API_URL: "http://django:8000/api/v1"
      # Mismo bug/fix real que sintel_ai (ver ese servicio arriba,
      # 2026-09-14) -- ALLOWED_HOSTS estricto de produccion rechaza Host:
      # django:8000 con DisallowedHost.
      DJANGO_INTERNAL_HOST_HEADER: "api.sintel.net.co"
      # Redis de produccion exige auth (requirepass) -- mismo patron que
      # sintel_ai, sin esto cost_control.py (reusado tal cual) fallaria con
      # NOAUTH en cada turno.
      CHECKPOINTER_REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/2"
      # Mision RAG-POST2 (FASE 7, 2026-09-16): sesion persistente real de
      # google-adk (DatabaseSessionService) -- MISMO Postgres que Django,
      # base de datos PROPIA (`sintel_adk_sessions`), tablas gestionadas
      # por el propio google-adk. Provisionar la base antes de activar
      # esto en produccion (una sola vez, ver AUDITORIA/PRODUCTION_SYNC_*.md):
      # docker exec sintel_prod_db psql -U ${DB_USER} -d ${DB_NAME} -c
      #   "CREATE DATABASE sintel_adk_sessions;"
      ADK_SESSION_BACKEND: "database"
      ADK_SESSION_DB_URL: "postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/sintel_adk_sessions"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      sintel_ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Mismo hallazgo/fix que sintel_ai arriba -- host.docker.internal no
    # resuelve solo en "sintel-network".
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sintel-network

  # ─── REVERSE PROXY (unico punto de entrada interno) ────────────────────────
  nginx:
    image: nginx:1.26-alpine
    container_name: sintel_prod_nginx
    restart: unless-stopped
    logging: *default-logging
    # Sin "ports": nginx NO se publica al host. Solo es alcanzable dentro de
    # sintel-network -- unicamente cloudflared le habla por nombre de servicio.
    expose:
      - "80"
      - "443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-upgrade-map.conf:/etc/nginx/conf.d/00-upgrade-map.conf:ro
      # Fase 2 (ADR-001, aislamiento de dominio del panel): directivas
      # compartidas por los dos virtual hosts (publico y panel.sintel.net.co).
      # Montado FUERA de conf.d/ a proposito -- ver cabecera de nginx-common.conf.
      - ./nginx-common.conf:/etc/nginx/nginx-common.conf:ro
      # Ruta ABSOLUTA del host, fuera del repositorio (mismo patron que
      # cloudflared en Fase 4): contiene el Cloudflare Origin Certificate
      # real (Fase 8). Nunca copiar origin.pem/origin.key dentro de ecommerce_sintel/.
      - "C:/Users/Administrator/sintel_secrets/certs:/etc/nginx/certs:ro"
      - sintel_prod_static_volume:/code/staticfiles:ro
      - sintel_prod_media_volume:/code/media:ro
      # Logs de acceso/error en archivos reales (Fase 17) ademas de stdout
      # (nginx.prod.conf define ambos destinos -- ver Fase 17 del roadmap).
      - ./logs/nginx:/var/log/nginx
      - /dev/null:/docker-entrypoint.d/10-listen-on-ipv6-by-default.sh:ro
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      # Puerto 80 (redirect a https, ver nginx.prod.conf): confirma que el
      # propio Nginx responde sin depender de ALLOWED_HOSTS/TLS de Django.
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - sintel-network

  # ─── TUNEL (unico punto de salida hacia Internet) ──────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:2026.7.1
    container_name: sintel_prod_cloudflared
    restart: unless-stopped
    logging: *default-logging
    command: tunnel --config /etc/cloudflared/config.yml run
    # Sin "ports": cloudflared inicia la conexion saliente hacia el edge de
    # Cloudflare (outbound), no necesita ningun puerto publicado ni abierto
    # en el router.
    # Ruta ABSOLUTA del host, fuera del repositorio a proposito: contiene las
    # credenciales reales del tunel (Fase 4). NUNCA copiar este contenido
    # dentro de ecommerce_sintel/. Solo config.yml + <tunnel-id>.json, sin el
    # cert.pem de cuenta (ese se queda en ~/.cloudflared, el contenedor no lo necesita).
    volumes:
      - "C:/Users/Administrator/.cloudflared/sintel-production:/etc/cloudflared:ro"
    depends_on:
      - nginx
    networks:
      - sintel-network

# ═════════════════════════════════════════════════════════════════════════════
# VOLÚMENES — Nombres distintos a docker-compose.yml (desarrollo) a proposito,
# para que dev y produccion nunca compartan datos aunque corran en el mismo host.
# ═════════════════════════════════════════════════════════════════════════════
volumes:
  sintel_prod_postgres_data:
    driver: local
  sintel_prod_redis_data:
    driver: local
  sintel_prod_static_volume:
    driver: local
  sintel_prod_media_volume:
    driver: local
  sintel_prod_kyc_volume:
    driver: local
  sintel_prod_beat_schedule:
    driver: local
  sintel_prod_mcp_tokens:
    driver: local
  sintel_prod_ollama_models:
    driver: local

# ═════════════════════════════════════════════════════════════════════════════
# NETWORKS — Una sola red para todo el stack de produccion (Fase 3).
# ═════════════════════════════════════════════════════════════════════════════
networks:
  sintel-network:
    driver: bridge
    name: sintel-network
