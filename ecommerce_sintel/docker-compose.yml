# =============================================================================
# DOCKER COMPOSE -- E-Commerce Sintel REST
# =============================================================================
#
# PROYECTO INDEPENDIENTE: solo contenedores de ecommerce_sintel.
#
# Composicion:
#   - PostgreSQL 16    (Base de datos)
#   - Redis 7.2        (Cache + Message Broker)
#   - Django 5.0+      (API REST + Daphne ASGI)
#   - Celery Worker    (Tareas asincronicas)
#   - Celery Beat      (Scheduler de tareas)
#   - Nginx 1.26       (Reverse proxy)
#   - Ollama           (LLM local para motor cognitivo -- puerto 11434)
#   - Sintel AI Engine (Motor LangChain/LangGraph -- puerto 8100; RAG sobre
#                       PostgreSQL+pgvector via ai_knowledge, FASE 1-4 de la
#                       mision de simplificacion arquitectonica, 2026-09-14 --
#                       ChromaDB retirado, ver AUDITORIA/ARCHITECTURE_SIMPLIFICATION_AUDIT.md)
#
# =============================================================================

name: ecommerce_sintel  # ← Nombre EXPLÍCITO del proyecto (evita conflictos)

services:

  # ─── INFRAESTRUCTURA ──────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: ecommerce_sintel_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - ecommerce_sintel_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_sintel_network

  db:
    # FASE 1 (mision de simplificacion arquitectonica, 2026-09-14): postgres:16-alpine
    # no trae la extension pgvector. pgvector/pgvector:pg16 es la imagen oficial del
    # proyecto pgvector, construida sobre el mismo postgres:16 (Debian, no alpine) con
    # la extension ya compilada -- mismo formato de datos, drop-in sobre el volumen
    # existente. No confundir con un cambio de motor de BD: sigue siendo Postgres 16.
    image: pgvector/pgvector:pg16
    container_name: ecommerce_sintel_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ecommerce_sintel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce_sintel_network


  # ─── APLICACIÓN ────────────────────────────────────────────────────────────
  django:
    build:
      context: ..
      dockerfile: ecommerce_sintel/Dockerfile
      target: runtime
    image: ecommerce_sintel:runtime
    container_name: ecommerce_sintel_django
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8000:8000"
    volumes:
      - .:/code
      - /code/static/panel/js/bundle
      - ecommerce_sintel_static_volume:/code/staticfiles
      - ecommerce_sintel_media_volume:/code/media
    env_file: .env
    environment:
      # Auto-reload via watchmedo (polling) — necesario porque inotify no funciona
      # en volúmenes Docker montados desde Windows/WSL2. Poner en false para prod.
      DEV_RELOAD: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ecommerce_sintel_network

  frontend:
    image: node:24-bookworm-slim
    container_name: ecommerce_sintel_frontend
    working_dir: /app
    # 2026-08-10 (AUDITORIA E2E CHATBOT): CHOKIDAR_USEPOLLING (abajo) mitiga el
    # EIO pero no lo elimina -- el proceso de Vite volvio a morir con la misma
    # excepcion no capturada (confirmado en logs reales) y, sin restart policy,
    # el contenedor quedo caido 18 horas sin que nada lo notara ni lo levantara
    # -- toda la SPA (incluido el chat de soporte) inalcanzable durante ese
    # tiempo. unless-stopped iguala esto al resto de los servicios (django,
    # celery_worker, etc., que ya lo tenian) para que un crash se autorecupere
    # en vez de quedar silencioso.
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      # 2026-08-08: el bind-mount de Docker Desktop en Windows es inestable con
      # la vigilancia nativa de archivos de chokidar (Vite) -- "Error: EIO: i/o
      # error, stat '/app'" tumbaba el proceso de Vite entero cada tanto
      # (excepcion no capturada), dejando el frontend caido. Polling evita
      # depender de eventos nativos del filesystem del host.
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - ecommerce_sintel_network

  # ─── WORKERS ASINCRONOS ────────────────────────────────────────────────────
  celery_worker:
    image: ecommerce_sintel:runtime
    container_name: ecommerce_sintel_celery_worker
    restart: unless-stopped
    command: celery -A ecommerce worker --loglevel=info --concurrency=4 -Q default,marketing,notifications
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_healthy
    volumes:
      - .:/code
      - ecommerce_sintel_media_volume:/code/media
    networks:
      - ecommerce_sintel_network

  celery_beat:
    image: ecommerce_sintel:runtime
    container_name: ecommerce_sintel_celery_beat
    restart: unless-stopped
    command: celery -A ecommerce beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_healthy
    volumes:
      - ecommerce_sintel_beat_schedule:/tmp/celery_beat
    networks:
      - ecommerce_sintel_network

  # ─── MOTOR COGNITIVO IA ────────────────────────────────────────────────────
  sintel_ollama:
    image: ollama/ollama:latest
    container_name: ecommerce_sintel_ollama
    restart: unless-stopped
    ports:
      # Auditoria de hardening (2026-09-14, "PROMPT MAESTRO"): "11434:11434" ataba a
      # 0.0.0.0 -- alcanzable desde cualquier interfaz/red de este host, no solo
      # localhost. Ollama nunca debe exponerse mas alla de lo que sus consumidores
      # reales (contenedores en ecommerce_sintel_network) necesitan; el bind a
      # 127.0.0.1 solo mantiene el acceso conveniente desde el propio host para
      # debug manual (`curl localhost:11434/...`), nunca desde la LAN/Internet.
      - "127.0.0.1:11434:11434"
    volumes:
      - ecommerce_sintel_ollama_models:/root/.ollama
    networks:
      - ecommerce_sintel_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  sintel_ai:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    image: ecommerce_sintel_ai:latest
    container_name: ecommerce_sintel_ai
    restart: unless-stopped
    ports:
      - "8100:8100"
    volumes:
      # FASE 5 (mision de simplificacion arquitectonica, 2026-09-14): el
      # bind-mount de solo lectura del repo (`.:/workspace:ro`) se retiro --
      # ningun modulo de ai_engine escanea codigo fuente del repo desde que
      # se elimino el pipeline de generacion de codigo (FASE 4a) y sus
      # consumidores de CODEBASE_PATH (FASE 5). Ver
      # AUDITORIA/ARCHITECTURE_SIMPLIFICATION_AUDIT.md.
      # FASE 10: tokens OAuth del MCP de Meta Ads (mcp_client/storage.py).
      # Persisten fuera de la imagen y no se versionan.
      - ecommerce_sintel_mcp_tokens:/data/mcp
    env_file: .env
    environment:
      OLLAMA_BASE_URL: "http://sintel_ollama:11434"
      MCP_TOKEN_STORE_DIR: "/data/mcp"
      # Fase 1 AI Core: URL interna hacia Django para resolver identidad
      # (JWT_SECRET_KEY ya llega via env_file compartido, no se duplica aqui)
      DJANGO_INTERNAL_API_URL: "http://django:8000/api/v1"
      # Fase 2: endpoint /tools/debug habilitado SOLO en dev
      AI_TOOLS_DEBUG: "true"
      # B2 (AUDITORIA/16): checkpointer del Action Graph -- DB 2, separada de Channels (0) y
      # Cache (1) de Django, mismo Redis del proyecto (ver redis_checkpointer.py).
      CHECKPOINTER_REDIS_URL: "redis://redis:6379/2"
    depends_on:
      sintel_ollama:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - ecommerce_sintel_network

  # ADK-11 (Cutover, ver AUDITORIA/ADK_CUTOVER_PLAN.md): servicio que
  # orquesta via Google ADK -- EN PRODUCCION desde 2026-09-14
  # (`settings.AI_ENGINE_URL` de Django/.env apunta aqui,
  # http://sintel_ai_adk:8101; `sintel_ai` -- OLD, LangGraph -- esta
  # detenido, `docker compose stop sintel_ai`, NO eliminado, para rollback
  # inmediato: revertir AI_ENGINE_URL en .env a http://sintel_ai:8100,
  # `docker compose up -d django celery_worker celery_beat` (recrea, no
  # basta `restart`), `docker compose start sintel_ai`). Definicion del
  # servicio OLD deliberadamente NO eliminada de este archivo -- esa
  # limpieza es ADK-12 (eliminacion del runtime viejo), una fase separada
  # con su propio checklist ("cero consumidores, tests, rollback"), no
  # parte de ADK-11.
  sintel_ai_adk:
    build:
      context: .
      dockerfile: ai_engine_adk/Dockerfile
    image: ecommerce_sintel_ai_adk:latest
    container_name: ecommerce_sintel_ai_adk
    restart: unless-stopped
    ports:
      - "8101:8101"
    env_file: .env
    environment:
      OLLAMA_BASE_URL: "http://sintel_ollama:11434"
      DJANGO_INTERNAL_API_URL: "http://django:8000/api/v1"
      # Mismo Redis/DB que el checkpointer de `sintel_ai` (cost_control.py
      # usa prefijos de clave propios, sin colision -- ver
      # ai_engine/cost_control.py).
      CHECKPOINTER_REDIS_URL: "redis://redis:6379/2"
      # Mision RAG-POST2 (FASE 7, 2026-09-16): sesion persistente real de
      # google-adk (DatabaseSessionService) -- MISMO Postgres que Django,
      # base de datos PROPIA (`sintel_adk_sessions`, no `${DB_NAME}`),
      # tablas gestionadas por el propio google-adk, nunca por Django/su
      # ORM. Provisionar la base antes del primer uso (una sola vez):
      # `docker compose exec db psql -U ${DB_USER} -d ${DB_NAME} -c
      # "CREATE DATABASE sintel_adk_sessions;"` -- ver
      # AUDITORIA/RAG_POST2_BASELINE.md / RAG_POST2_FINAL_CERTIFICATION.md.
      ADK_SESSION_BACKEND: "database"
      ADK_SESSION_DB_URL: "postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/sintel_adk_sessions"
    depends_on:
      sintel_ollama:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - ecommerce_sintel_network

  # ─── REVERSE PROXY ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.26-alpine
    container_name: ecommerce_sintel_nginx
    restart: unless-stopped
    ports:
      # Puerto 80 del host ocupado por IIS (World Wide Web Publishing Service)
      # en esta maquina Windows -- remapeado a 8080, sin tocar el puerto 80
      # interno del contenedor ni la config de nginx.conf.
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-upgrade-map.conf:/etc/nginx/conf.d/00-upgrade-map.conf:ro
      - ecommerce_sintel_static_volume:/code/staticfiles:ro
      - ecommerce_sintel_media_volume:/code/media:ro
      - /dev/null:/docker-entrypoint.d/10-listen-on-ipv6-by-default.sh:ro
    depends_on:
      django:
        condition: service_healthy
    networks:
      - ecommerce_sintel_network

# ═════════════════════════════════════════════════════════════════════════════
# VOLÚMENES — Persistencia de datos (aislados a este proyecto)
# ═════════════════════════════════════════════════════════════════════════════
volumes:
  ecommerce_sintel_postgres_data:
    driver: local
  ecommerce_sintel_redis_data:
    driver: local
  ecommerce_sintel_static_volume:
    driver: local
  ecommerce_sintel_media_volume:
    driver: local
  ecommerce_sintel_beat_schedule:
    driver: local
  ecommerce_sintel_ollama_models:
    driver: local
  ecommerce_sintel_mcp_tokens:
    driver: local

# ═════════════════════════════════════════════════════════════════════════════
# NETWORKS — Aislamiento de contenedores (solo ecommerce_sintel)
# ═════════════════════════════════════════════════════════════════════════════
networks:
  ecommerce_sintel_network:
    driver: bridge
    name: ecommerce_sintel_network
