# nginx-common.conf — Fase 2 (aislamiento de dominio del panel, ADR-001)
#
# Directivas COMPARTIDAS entre el virtual host publico (sintel.net.co/www/api)
# y el virtual host dedicado del panel (panel.sintel.net.co). Se factorizaron
# aqui para que ambos server{} sigan sirviendo exactamente el mismo backend
# Django, el mismo certificado y las mismas cabeceras de seguridad sin
# duplicar ~80 lineas en nginx.prod.conf (evita que los dos virtual hosts
# diverjan por accidente en un futuro cambio de CSP/gzip/SSL).
#
# Montado en /etc/nginx/nginx-common.conf (fuera de conf.d/) a proposito:
# el nginx.conf base incluye automaticamente conf.d/*.conf en el contexto
# http{}, y este archivo contiene "location{}" -- valido solo dentro de un
# server{}. Si viviera en conf.d/ se cargaria dos veces (una por el include
# automatico, otra por el "include" explicito de abajo) y la segunda
# fallaria al arrancar.
#
# Lo que SI queda fuera de este archivo, a proposito, porque puede
# necesitar divergir entre paneles y sitio publico en el futuro sin tocar
# este archivo compartido: server_name, access_log/error_log, limit_req.

# ── Cloudflare Origin Certificate (Fase 8) ──────────────────────────────
# Nunca Let's Encrypt (ver roadmap Fase 8): certificado de 15 anos,
# sin renovaciones. Montado read-only desde fuera del repositorio.
# Wildcard (*.sintel.net.co) -- cubre panel.sintel.net.co sin emitir nada nuevo.
ssl_certificate     /etc/nginx/certs/origin.pem;
ssl_certificate_key /etc/nginx/certs/origin.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

client_max_body_size 50M;
keepalive_timeout 65;

# ── Compresion ───────────────────────────────────────────────────────────
# Brotli omitido a proposito: nginx:1.26-alpine no trae ngx_http_brotli_module
# compilado (verificado con `nginx -V`) y no viene como paquete apk oficial;
# compilarlo a mano anadiria mantenimiento no justificado para este proyecto.
# gzip cubre el mismo objetivo de compresion con el modulo ya incluido.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types text/plain text/css text/xml text/javascript
           application/json application/javascript application/xml application/xml+rss
           application/vnd.ms-fontobject application/x-font-ttf font/opentype
           image/svg+xml image/x-icon;

# ── Cabeceras de seguridad ───────────────────────────────────────────────
# SECURE_HSTS_SECONDS ya esta activo en Django (settings/production.py),
# pero Django no ve las requests a /static/ ni /media/ (las sirve Nginx
# directamente) -- se repite aqui para que TODAS las respuestas la lleven.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# CSP -- cubre el SPA (self), el widget de pago Wompi, y WebSocket hacia
# api.sintel.net.co (Channels). Identica para el panel: el panel llama a
# la misma API (VITE_API_BASE_URL no cambia entre dominios, ver ADR-001).
# static.cloudflareinsights.com: Cloudflare inyecta su beacon de analitica
# automaticamente en zonas proxiadas (RUM) -- no es algo que este proyecto
# agregue, pero el CSP debe permitirlo o el navegador lo bloquea (bug real
# visto en consola, Fase 22 post-roadmap).
# cdn.jsdelivr.net (Bootstrap CSS/JS + Bootstrap Icons) y fonts.google*
# (tipografia Inter): son dependencias reales del shell HTML
# (templates/spa_shell.html, replica frontend/index.html) -- sin esto
# navbar/footer/banner cargan sin ningun estilo de Bootstrap (bug real
# visto en produccion, Fase 22 post-roadmap).
# connect-src tambien necesita cdn.jsdelivr.net: el navegador (con DevTools
# abierto) intenta descargar el sourcemap (*.css.map/*.js.map) referenciado
# al final de los archivos de Bootstrap servidos desde ese CDN -- esa
# descarga la gobierna connect-src, no style-src/script-src (bug real visto
# en consola de produccion).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.wompi.co https://static.cloudflareinsights.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' https://api.sintel.net.co wss://api.sintel.net.co https://checkout.wompi.co https://cloudflareinsights.com https://cdn.jsdelivr.net; frame-src https://checkout.wompi.co;" always;

# ── Bloqueo de endpoints internos del AI Engine ────────────────────────────
# /api/v1/internal/ es exclusivo para la red Docker interna (sintel_ai -> django).
# Nunca debe ser accesible desde Internet. Nginx rechaza antes del proxy.
location /api/v1/internal/ {
    deny all;
    return 403;
}

# ── API y WebSocket ──────────────────────────────────────────────────────
location / {
    proxy_pass http://django;
    proxy_http_version 1.1;

    # WebSocket headers (required for Daphne/Channels)
    # $connection_upgrade se define en 00-upgrade-map.conf:
    #   WebSocket (Upgrade: websocket) -> Connection: upgrade
    #   HTTP normal                    -> Connection: close
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_read_timeout 86400;  # 24h for long-lived WebSocket connections
}

# ── Archivos estáticos ───────────────────────────────────────────────────
location /static/ {
    alias /code/staticfiles/;
    expires 30d;
    etag on;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    gzip_static on;
}

# ── Favicon desde estáticos ────────────────────────────────────────────────
# No existe favicon.ico (nunca se genero uno) -- el bundle de Vite si trae
# favicon.svg (Fase 22 post-roadmap, error real visto en consola del navegador).
location = /favicon.ico {
    alias /code/staticfiles/panel/js/bundle/favicon.svg;
    expires 30d;
    etag on;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# ── Archivos de media (uploads) ──────────────────────────────────────────
location /media/ {
    alias /code/media/;
    expires 7d;
    etag on;
    add_header Cache-Control "public";
}
