upstream django {
    server django:8000;
}

# ── Rate limiting ──────────────────────────────────────────────────────────
# Zona compartida por IP de origen. burst=20 nodelay absorbe rafagas cortas
# (carga inicial del SPA + varias llamadas API en paralelo) sin bloquear
# trafico legitimo; conexiones WebSocket de larga duracion solo consumen la
# zona al abrir la conexion, no durante su vida util.
limit_req_zone $binary_remote_addr zone=sintel_limit:10m rate=20r/s;

# ── Redirect HTTP -> HTTPS ──────────────────────────────────────────────────
# Nginx solo es alcanzable dentro de sintel-network (cloudflared -> nginx),
# nunca desde Internet directamente, pero se mantiene el redirect como buena
# practica estandar y por si algun healthcheck interno usa 80. Compartido por
# los 4 dominios: el redirect es identico sin importar el destino.
server {
    listen 80;
    listen [::]:80;
    server_name sintel.net.co www.sintel.net.co api.sintel.net.co panel.sintel.net.co;
    return 301 https://$host$request_uri;
}

# =============================================================================
# VIRTUAL HOST — Sitio publico + API (sintel.net.co, www, api)
# =============================================================================
# Fase 2 (ADR-001, aislamiento de dominio del panel): panel.sintel.net.co se
# separo a su propio server{} mas abajo. Este bloque no cambio de
# comportamiento -- mismo upstream django, mismo certificado, mismas
# cabeceras (ver nginx-common.conf) -- solo perdio panel.sintel.net.co del
# server_name y gano su propio access_log/error_log.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sintel.net.co www.sintel.net.co api.sintel.net.co;

    access_log /var/log/nginx/public.access.log;
    error_log  /var/log/nginx/public.error.log;

    limit_req zone=sintel_limit burst=40 nodelay;

    include /etc/nginx/nginx-common.conf;
}

# =============================================================================
# VIRTUAL HOST — Panel Administrativo (panel.sintel.net.co)
# =============================================================================
# Fase 2 (ADR-001): virtual host dedicado, con logs propios y espacio para
# politicas de seguridad futuras (ej. endurecer limit_req o anadir IP
# allowlist aqui sin afectar el sitio publico/API). Mismo upstream django,
# mismo certificado wildcard, mismas cabeceras -- no hay backend nuevo, la
# API sigue siendo la misma (ver nginx-common.conf). La exclusividad real
# del panel (que este dominio solo muestre /panel/* y los otros 3 dejen de
# mostrarlo) la aplica el guard de host en el Vue Router -- Fase 3.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.sintel.net.co;

    access_log /var/log/nginx/panel.access.log;
    error_log  /var/log/nginx/panel.error.log;

    # Misma politica que el sitio publico hoy; queda declarada por separado
    # a proposito para poder endurecerla sin tocar el virtual host publico.
    limit_req zone=sintel_limit burst=40 nodelay;

    include /etc/nginx/nginx-common.conf;
}
