name: CI

# Quality Gate minimo (item transversal de la Auditoria Enterprise, 2026-07-24):
# tests + cobertura + SAST en cada PR, corriendo contra Postgres real -- no
# SQLite (ver C-04: select_for_update() no bloquea filas de verdad en SQLite,
# asi que los tests de concurrencia de Orders/Cart/Renting necesitan Postgres
# para probar lo que dicen probar).
#
# [CORREGIDO 2026-07-29, AUDITORIA/14_GRAPHIFY_KNOWLEDGE_GRAPH.md §16 Fase 6/7]
# Este archivo vivia en `ecommerce_sintel/.github/workflows/ci.yml` desde su
# creacion (2026-07-25, commit a457ac6) -- GitHub Actions SOLO descubre
# workflows en `.github/workflows/` de la RAIZ real del repositorio (la raiz
# real es esta carpeta, `ecommerce_sintel/` es una subcarpeta, confirmado con
# `git rev-parse --show-toplevel`). Con `ci.yml` un nivel mas adentro de lo
# debido, es altamente probable que este Quality Gate (tests+cobertura+Bandit)
# **nunca se haya ejecutado en GitHub** pese a estar documentado como
# "Existe" en `AUDITORIA/01_AUDITORIA_GENERAL.md` §1 -- el mismo tipo exacto
# de desincronizacion doc-vs-realidad que motivo toda esta auditoria, esta
# vez en la propia infraestructura de CI. Movido aqui + agregado
# `defaults.run.working-directory: ecommerce_sintel` para que `poetry`/
# `manage.py`/`bandit` seguan resolviendo rutas igual que antes (los comandos
# nunca cambiaron, solo el punto de partida del checkout).

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: ecommerce_sintel

jobs:
  test:
    name: Tests + cobertura (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sintel_ecommerce_ci
          POSTGRES_USER: sintel_ci
          POSTGRES_PASSWORD: sintel_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: ecommerce.settings.development
      SECRET_KEY: ci-only-secret-key-never-use-in-prod
      JWT_SECRET_KEY: ci-only-jwt-secret-never-use-in-prod
      DEBUG: "False"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: sintel_ecommerce_ci
      DB_USER: sintel_ci
      DB_PASSWORD: sintel_ci_password
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: poetry

      - name: Sincronizar poetry.lock
        # Mismo patron que el builder del Dockerfile (RUN poetry lock && poetry
        # check --lock): regenera el lock si pyproject.toml cambio, en vez de
        # asumir que quien abre el PR se acordo de correr `poetry lock` a mano.
        run: poetry lock && poetry check --lock

      - name: Instalar dependencias (main + dev)
        run: poetry install --no-interaction --with dev

      - name: Migraciones sin diffs pendientes
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Django system check
        run: poetry run python manage.py check

      - name: Tests + cobertura
        # El umbral de cobertura (--cov-fail-under) y la guardia de Postgres
        # (conftest.py raiz) viven en pytest.ini / conftest.py -- no se
        # repiten aqui para que local y CI corran exactamente el mismo gate.
        run: poetry run pytest

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          # Rutas de `with.path` en actions/upload-artifact son relativas a
          # $GITHUB_WORKSPACE (la raiz real), NO al `defaults.run.working-directory`
          # de arriba (ese solo afecta pasos `run:`) -- por eso el prefijo.
          path: ecommerce_sintel/coverage.xml
          retention-days: 14

  security:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: poetry

      - name: Sincronizar poetry.lock
        # Mismo patron que el builder del Dockerfile (RUN poetry lock && poetry
        # check --lock): regenera el lock si pyproject.toml cambio, en vez de
        # asumir que quien abre el PR se acordo de correr `poetry lock` a mano.
        run: poetry lock && poetry check --lock

      - name: Instalar dependencias (main + dev)
        run: poetry install --no-interaction --with dev

      - name: Bandit (solo severidad MEDIUM y superior)
        # -c pyproject.toml aplica [tool.bandit]: excluye migrations/tests/
        # frontend/node_modules y omite B101 (assert, normal en tests). Los 2
        # nosec puntuales de 0.0.0.0 (accounts/services/commands.py,
        # sms_bridge/bridge.py) ya estan documentados inline -- este job debe
        # correr en 0 hallazgos reales; si aparece uno nuevo, es señal real.
        run: poetry run bandit -c pyproject.toml -r . -ll

      - name: AI_TOOLS_DEBUG nunca en un compose de produccion
        # F1 (AUDITORIA/16_AUDITORIA_AI_ENGINE_SYNC.md, 2026-08-01): ese flag habilita un
        # endpoint del AI Engine con menos capas de Policy Layer que el flujo normal de /chat.
        # Hoy solo vive en docker-compose.yml (dev) -- este check falla el job si alguna vez
        # aparece en el compose de produccion (ej. al fusionar archivos compose a futuro).
        run: |
          if grep -q "AI_TOOLS_DEBUG" docker-compose.prod.yml; then
            echo "AI_TOOLS_DEBUG no debe aparecer en docker-compose.prod.yml" >&2
            exit 1
          fi

  graph-audit:
    name: Grafo de conocimiento (advertencia, no bloqueante)
    runs-on: ubuntu-latest
    # Fase 6/7 de AUDITORIA/14_GRAPHIFY_KNOWLEDGE_GRAPH.md: arranca deliberadamente en modo
    # "advertencia" (comenta el PR, nunca falla el job por hallazgos -- graph_validator.py no
    # hace sys.exit(1) en ningun caso, solo si el propio script crashea). Igual que Bandit se
    # dejo correr un tiempo antes de ser gate, esto se promueve a bloqueante mas adelante solo
    # si no hay falsos positivos reportados por el equipo -- ver doc §9 Fase 7 "Riesgos".
    #
    # [CORREGIDO 2026-09-14, auditoria "PROMPT MAESTRO" de hardening] Este job seguia
    # apuntando a `ai_engine/auditor.py`, retirado del repo desde la Fase 8 del plan de
    # separacion project_knowledge_graph (2026-08-08, `project_knowledge_graph/audit/
    # auditor.py` lo reemplazo explicitamente, ver su propio docstring: "Reemplaza a
    # ai_engine/auditor.py::ProjectAuditor.run()"). El job llevaba mas de un mes fallando
    # en cada PR (no bloqueante, pero roto) sin que nadie lo notara -- la propia definicion
    # de "divergencia doc/codigo no detectada" que esta auditoria buscaba. Misma logica, 6
    # validaciones, mismo esquema de `summary` (confirmado: `validator.py::run_all_
    # validations()` sigue devolviendo las mismas 6 claves). Sin Django/Postgres/Redis --
    # `project_knowledge_graph/audit/auditor.py` no importa Django (confirmado), mismo
    # criterio que el job original.
    defaults:
      run:
        # project_knowledge_graph vive en la raiz de ecommerce_sintel/ (no dentro de
        # ai_engine/) -- usa el working-directory por defecto del workflow.
        working-directory: ecommerce_sintel
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth 0 (no shallow clone): graph_validator.py::find_stale_documentation
          # necesita `git log` real por carpeta para comparar contra la fecha declarada en
          # cada doc -- con un shallow clone esa validacion no encontraria historial y se
          # quedaria en silencio (falso negativo), no falla ruidosa.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias minimas
        # Deliberado: project_knowledge_graph/audit/auditor.py + validator.py son
        # stdlib puro salvo pyyaml (usado por sus enrichers de docker/nginx/agents).
        run: pip install pyyaml

      - name: Construir grafo y correr las 6 validaciones
        run: python -m project_knowledge_graph.cli audit

      - name: Comentar resumen en el PR (crea o actualiza un unico comentario, no acumula)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('ecommerce_sintel/project_knowledge_graph/data/GRAPH_VALIDATION_REPORT.json', 'utf8'));
            const s = report.summary;
            const marker = '### Grafo de conocimiento — resumen automatico';
            const body = [
              marker,
              '',
              '| Validacion | Hallazgos |',
              '|---|---|',
              `| Documentacion huerfana | ${s.orphaned_app_docs} |`,
              `| Documentacion desactualizada (codigo cambio despues de la fecha declarada) | ${s.stale_documentation} |`,
              `| Violaciones de Service Layer (escritura en selectors.py) | ${s.service_layer_violations} |`,
              `| Grupos de Apps mutuamente acopladas en circulo (SCC) | ${s.import_cycles} |`,
              `| Componentes Vue sin consumidor detectado | ${s.dead_frontend_components} |`,
              `| Conteos contradictorios (revisar con cautela, alta tasa de ruido conocida) | ${s.contradictory_counts} |`,
              '',
              '_No bloqueante. Detalle completo en el artifact `graph-validation-report` de este ' +
              'job. Metodologia y limitaciones conocidas de cada validacion: ' +
              '`AUDITORIA/14_GRAPHIFY_KNOWLEDGE_GRAPH.md` §15._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }

      - name: Publicar grafo y reporte completos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-validation-report
          # Igual que en el job `test`: rutas de artifact relativas a $GITHUB_WORKSPACE,
          # no al working-directory del job (ecommerce_sintel) -- por eso el prefijo
          # completo aqui tambien. Ver project_knowledge_graph/config.py::DATA_DIR.
          path: |
            ecommerce_sintel/project_knowledge_graph/data/GRAPH_VALIDATION_REPORT.json
            ecommerce_sintel/project_knowledge_graph/data/GRAPH_VIEW.html
            ecommerce_sintel/project_knowledge_graph/data/KNOWLEDGE_GRAPH.json
          retention-days: 14

  dependency-audit:
    name: Supply chain -- vulnerabilidades conocidas (advertencia, no bloqueante)
    runs-on: ubuntu-latest
    # Auditoria de hardening (2026-09-14, "PROMPT MAESTRO" seccion 30, "Supply
    # chain"). Arranca en modo "advertencia" (igual que graph-audit lo hizo al
    # nacer, Fase 6/7 de AUDITORIA/14) -- se promueve a bloqueante mas adelante
    # solo si no genera ruido. Corre pip-audit contra los 2 lock files reales
    # (ai_engine/requirements.lock.txt, ai_engine_adk/requirements.lock.txt --
    # snapshot exacto de todo el arbol resuelto, no solo las dependencias
    # directas). Confirmado localmente (2026-09-14) que ya hay hallazgos reales:
    # starlette/langchain-core/langgraph/mcp desactualizados en el runtime OLD
    # -- ver AUDITORIA/HARDENING_PRODUCCION_2026-09-14.md.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar pip-audit
        run: pip install pip-audit

      - name: Auditar ai_engine (runtime OLD, Policy Layer + AI Gateway)
        if: always()
        run: pip-audit -r ecommerce_sintel/ai_engine/requirements.lock.txt || true

      - name: Auditar ai_engine_adk (runtime NUEVO, chat de soporte real)
        if: always()
        run: pip-audit -r ecommerce_sintel/ai_engine_adk/requirements.lock.txt || true
